sonar.projectKey = jhipster-sample-app-frontend
sonar.projectName = jhipster-sample-app-frontend

# Typescript tests files must be inside sources and tests, otherwise `INFO: Test execution data ignored for 80 unknown
# files, including:` is shown.
sonar.sources = src
sonar.tests = src
sonar.host.url = http://localhost:9001
sonar.sourceEncoding = UTF-8

sonar.test.inclusions = src/app/**/*.spec.ts
sonar.exclusions = src/content/**/*.*, src/i18n/*.ts
sonar.javascript.lcov.reportPaths = coverage/lcov.info
sonar.testExecutionReportPaths = coverage/TESTS-results-sonar-vitest.xml
