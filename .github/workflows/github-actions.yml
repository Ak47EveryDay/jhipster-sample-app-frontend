name: Frontend CI
on:
  push:
  pull_request:
jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NG_CLI_ANALYTICS: 'false'
      # End-to-end tests need the backend and are not run in CI, so the Cypress binary is not downloaded.
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint and unit tests
        run: npm test
      - name: Build
        run: npm run build
